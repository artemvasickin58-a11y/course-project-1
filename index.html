<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Угадай число</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
    
    

</head>
<body>

<div class="container">

    <h1>🎯 Угадай число</h1>

    <!-- Старт -->
    <div id="start-screen">
        <input type="text" id="playerName" placeholder="Введите имя">
        <button id="startBtn">▶ Начать</button>
    </div>

    <!-- Игра -->
    <div id="game-screen" class="hidden">
        <p id="welcome"></p>

        <div class="input-group">
            <input type="number" id="guessInput" placeholder="Число 1-100">
            <button id="guessBtn">✔</button>
        </div>

        <p id="message"></p>
        <p id="attempts"></p>

        <button id="newGameBtn">🔄 Новая игра</button>

        <button id="clearRecordsBtn">🗑 Очистить рекорды</button>
    </div>

    <!-- Рекорды -->
    <div class="records">
        <h2>🏆 Рекорды</h2>
        <ul id="recordList"></ul>
    </div>

</div>

</body>
</html>
